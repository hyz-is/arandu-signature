# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares
# it with what the code calls, because `aru doctor` reads the application and
# never opens an installed package.

name = "hyz-is/signature"
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# It renders a line and serves three embedded assets. Nothing leaves the
# process.
network = false
# It keeps no state at all.
filesystem = false
# On a desktop build of an Ayra app, native.OpenURL hands an address to the
# operating system's opener (open, xdg-open, rundll32). Nothing else runs
# another program, and neither the web half nor the Android, iOS or browser
# builds do.
exec = true
# It owns no table.
migrations = false
